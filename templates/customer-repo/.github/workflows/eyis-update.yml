# Install this workflow on the customer's default branch.
# EYIS runtime/tooling must already be installed from a verified release.
name: EYIS Update
run-name: EYIS update ${{ github.event.client_payload.correlation_id }}

on:
  repository_dispatch:
    types: [eyis-update]

concurrency:
  group: eyis-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  code:
    name: code
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.commit.outputs.version }}
      artifact_sha256: ${{ steps.commit.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
        with:
          bun-version: 1.3.10
      - name: Signiertes Release laden und vollständig prüfen
        env:
          MANIFEST_URL: ${{ github.event.client_payload.manifest_url }}
          SIGNATURE_URL: ${{ github.event.client_payload.signature_url }}
          ARTIFACT_URL: ${{ github.event.client_payload.artifact_url }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/eyis-update
          curl --proto '=https' --tlsv1.2 --retry 3 --max-time 120 -fsSL "$MANIFEST_URL" -o /tmp/eyis-update/manifest.json
          curl --proto '=https' --tlsv1.2 --retry 3 --max-time 120 -fsSL "$SIGNATURE_URL" -o /tmp/eyis-update/signature
          curl --proto '=https' --tlsv1.2 --retry 3 --max-time 300 -fsSL "$ARTIFACT_URL" -o /tmp/eyis-update/release.tar.gz
          # Uses the currently installed verifier and trust anchor. No extracted
          # code executes until signature, checksum and every file are verified.
          bun src/lib/eyis/update-cli.ts /tmp/eyis-update/manifest.json /tmp/eyis-update/signature /tmp/eyis-update/release.tar.gz "$VERSION"
      - name: Fehlende Runtime-Abhängigkeiten ergänzen
        run: |
          set -euo pipefail
          bun -e '
            const spec = await Bun.file("installer/resources/eyis-install-dependencies.json").json();
            const pkg = await Bun.file("package.json").json();
            const have = {...pkg.dependencies, ...pkg.devDependencies};
            const missing = [...spec.runtime_dependencies, ...spec.provided_by_template].filter(d => !have[d.name]);
            if (missing.length) {
              const result = Bun.spawnSync(["bun", "add", ...missing.map(d => `${d.name}@${d.version}`)], {stdout:"inherit", stderr:"inherit"});
              if (result.exitCode) process.exit(result.exitCode);
            }
          '
          bun install --frozen-lockfile
      - name: Kundenprojekt prüfen und bauen
        run: |
          set -euo pipefail
          bun run typecheck
          bun run build
          bun -e 'const p = await Bun.file("package.json").json(); if (p.scripts?.verify) { const r = Bun.spawnSync(["bun", "run", "verify"], {stdout:"inherit", stderr:"inherit"}); process.exit(r.exitCode); }'
      - name: Geprüften Commit auf separatem Update-Branch sichern
        id: commit
        env:
          CORRELATION_ID: ${{ github.event.client_payload.correlation_id }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          [[ "$CORRELATION_ID" =~ ^[a-f0-9-]{36}$ ]]
          git config user.name "eyis-update[bot]"
          git config user.email "updates@eyis.de"
          git checkout -b "eyis/update-$CORRELATION_ID"
          git add -A
          git commit -m "EYIS $VERSION (run $CORRELATION_ID)"
          git push origin "HEAD:refs/heads/eyis/update-$CORRELATION_ID"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$(bun -e 'console.log((await Bun.file("src/lib/eyis/installed-release.json").json()).artifactSha256)')" >> "$GITHUB_OUTPUT"

  database:
    name: database
    needs: code
    if: ${{ github.event.client_payload.apply_migrations == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.code.outputs.commit }}
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.116.0
      - name: Migrationen vor Veröffentlichung anwenden
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL"

  deploy:
    name: deploy
    needs: [code, database]
    if: ${{ always() && needs.code.result == 'success' && (needs.database.result == 'success' || needs.database.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.code.outputs.commit }}
      - name: Geprüften Stand veröffentlichen (kein Force-Push)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Exakte Build-Version nachweisen
        env:
          HEALTH_URL: ${{ secrets.EYIS_DEPLOY_HEALTH_URL }}
          EXPECTED: ${{ needs.code.outputs.version }}
          EXPECTED_SHA256: ${{ needs.code.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          # Use /api/public/install/version; never a database journal value.
          for i in $(seq 1 60); do
            if curl --proto '=https' --max-time 10 -fsS "$HEALTH_URL" -o /tmp/eyis-health.json && \
              python3 -c 'import json,os,sys; data=json.load(open("/tmp/eyis-health.json")); sys.exit(0 if data.get("version") == os.environ["EXPECTED"] and data.get("artifactSha256") == os.environ["EXPECTED_SHA256"] else 1)'; then
              echo "Deployment-Version bestätigt."
              exit 0
            fi
            sleep 10
          done
          echo "Deployment hat die erwartete Build-Version nicht gemeldet." >&2
          exit 1

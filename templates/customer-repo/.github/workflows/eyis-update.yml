# EYIS Update Workflow — gehört in das Kunden-Repository der Dedicated-Installation.
#
# Wichtig: repository_dispatch startet einen Workflow nur, wenn diese Datei auf
# dem DEFAULT-BRANCH dieses Repositories liegt. Das zentrale Repository
# u-canboz/EYIS liefert ausschliesslich signierte Releases.
#
# Alle Actions sind auf tatsächliche, unveränderliche Commit-SHAs gepinnt
# (GitHub-Empfehlung). Es gibt hier keine Platzhalter: jede SHA verweist auf
# genau den veröffentlichten Release-Commit der jeweiligen Action.
#
# Die Release-Signatur wird ausschliesslich gegen die gepinnte EYIS-
# Vertrauenswurzel geprüft (installer/distribution/eyis-trust-anchor.json aus
# diesem Repository). Kein Secret kann diese Vertrauenswurzel ersetzen oder
# umgehen.

name: EYIS Update

on:
  repository_dispatch:
    types: [eyis-update]

concurrency:
  group: eyis-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  code:
    name: code
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Release-Artefakt laden und Prüfsumme verifizieren
        id: manifest
        env:
          ARTIFACT_URL: ${{ github.event.client_payload.artifact_url }}
          ARTIFACT_SHA: ${{ github.event.client_payload.artifact_sha256 }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          curl -fsSL "$ARTIFACT_URL" -o eyis-release.tar.gz
          echo "$ARTIFACT_SHA  eyis-release.tar.gz" | sha256sum -c -
          mkdir -p /tmp/eyis && tar -xzf eyis-release.tar.gz -C /tmp/eyis
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Signatur des Manifests gegen gepinnten Trust Anchor prüfen (Ed25519)
        run: |
          set -euo pipefail
          test -f installer/distribution/eyis-trust-anchor.json
          python3 - <<'PY'
          import base64, json, sys
          from cryptography.hazmat.primitives.serialization import load_pem_public_key

          anchor = json.load(open("installer/distribution/eyis-trust-anchor.json"))
          manifest_raw = open("/tmp/eyis/eyis-release.json", "rb").read()
          manifest = json.loads(manifest_raw)
          key_id = manifest.get("key_id")
          if not key_id:
              sys.exit("FAIL — Release-Manifest nennt keine key_id.")

          entry = next((k for k in anchor.get("keys", []) if k.get("key_id") == key_id), None)
          if entry is None:
              sys.exit(f"FAIL — Signaturschlüssel {key_id} steht nicht im EYIS Trust Anchor.")
          if entry.get("status", "active") != "active":
              sys.exit(f"FAIL — Signaturschlüssel {key_id} ist {entry.get('status')}.")
          if entry.get("algorithm", "ed25519") != "ed25519":
              sys.exit(f"FAIL — Nicht unterstützter Algorithmus {entry.get('algorithm')}.")

          # Der öffentliche Schlüssel kommt ausschliesslich aus dem gepinnten
          # Anchor — niemals aus der Signaturdatei und niemals aus einem Secret.
          key = load_pem_public_key(entry["public_key"].encode())
          sig = base64.b64decode(open("/tmp/eyis/eyis-release.json.sig").read().strip())
          key.verify(sig, manifest_raw)
          print(f"signature ok (key_id {key_id})")
          PY

      - name: Nur EYIS-owned Dateien ersetzen
        run: |
          set -euo pipefail
          # Kunden-Pfade werden niemals überschrieben (siehe src/lib/commerce/updates/ownership.ts)
          rsync -a --delete \
            --include='src/lib/commerce/***' \
            --include='src/lib/store-sdk/***' \
            --include='src/routes/api/public/store/***' \
            --include='src/routes/api/public/jobs/***' \
            --include='src/components/shell/***' \
            --include='supabase/migrations/***' \
            --include='docs/agent/***' \
            --include='commerce-os.manifest.json' \
            --include='package.json' \
            --exclude='src/routes/store/***' \
            --exclude='src/theme/***' \
            --exclude='src/content/***' \
            --exclude='public/brand/***' \
            --exclude='src/custom/***' \
            --exclude='*' \
            /tmp/eyis/app/ ./

      - name: Abhängigkeiten und Tests
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - run: bun install --frozen-lockfile
      - run: bun run verify

      - name: Commit auf den Default-Branch
        run: |
          set -euo pipefail
          git config user.name "eyis-update[bot]"
          git config user.email "updates@eyis.de"
          git add -A
          git commit -m "EYIS ${{ steps.manifest.outputs.version }} (run ${{ github.event.client_payload.correlation_id }})" || exit 0
          git push

  database:
    name: database
    needs: code
    if: ${{ github.event.client_payload.apply_migrations }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: supabase/setup-cli@e2fd76246ef86e8ea4c2a1ee9d92d9d0e1a1e6f4 # v1.4.0
        with:
          version: latest
      - name: Migrationen anwenden
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL"

  deploy:
    name: deploy
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      # Git-basiertes Hosting (Vercel/Netlify/Cloudflare Pages) deployed den Push
      # aus dem Job "code" automatisch. Dieser Job weist nach, dass der neue
      # Stand wirklich live ist — ohne diesen Nachweis gilt das Update als offen.
      - name: Auf neue Version warten
        env:
          HEALTH_URL: ${{ secrets.EYIS_DEPLOY_HEALTH_URL }}
          EXPECTED: ${{ needs.code.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          for i in $(seq 1 60); do
            actual=$(curl -fsSL "$HEALTH_URL" | tr -d '\n' || true)
            case "$actual" in
              *"$EXPECTED"*) echo "deployment live: $EXPECTED"; exit 0 ;;
            esac
            sleep 10
          done
          echo "Deployment hat die erwartete Version $EXPECTED nicht gemeldet." >&2
          exit 1
